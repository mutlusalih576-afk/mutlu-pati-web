backend:
  name: git-gateway
  branch: main

media_folder: "images/uploads"
public_folder: "/images/uploads"

locale: "tr"

collections:
  - name: "products"
    label: "Ürünler"
    files:
      - name: "products"
        label: "Ürün Listesi"
        file: "content/products.json"
        fields:
          - label: "WhatsApp Numaranız (başında 90 ile, boşluksuz)"
            name: "whatsapp_number"
            widget: "string"
            hint: "Örnek: 905321234567"
          - label: "Ürünler"
            name: "items"
            widget: "list"
            label_singular: "Ürün"
            summary: "{{fields.name}} — ₺{{fields.price}}"
            fields:
              - {label: "Ürün Adı", name: "name", widget: "string"}
              - label: "Kategori"
                name: "category"
                widget: "select"
                required: false
                default: "Diğer"
                options: ["Mama", "Oyuncak", "Bakım", "Elbise & Aksesuar", "Tuvalet & Kum", "Diğer"]
              - label: "Hayvan Türü"
                name: "pet_type"
                widget: "select"
                required: false
                default: "Genel"
                options: ["Köpek", "Kedi", "Kuş", "Balık", "Tavşan", "Kemirgen", "Genel"]
              - {label: "Açıklama", name: "description", widget: "text", required: false}
              - {label: "Fiyat (₺)", name: "price", widget: "number", value_type: "float"}
              - {label: "Fotoğraf", name: "image", widget: "image", required: false, choose_url: false}
              - {label: "Kartla Ödeme Linki (PayTR vb. — boş bırakılabilir)", name: "payment_link", widget: "string", required: false}
